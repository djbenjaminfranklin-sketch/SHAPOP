<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShaPop — Nouveau mot de passe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 400px; padding: 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .subtitle { color: #888; font-size: 14px; text-align: center; margin-bottom: 32px; }
  label { display: block; font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #1A1A1A; border-radius: 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 20px; }
  input:focus { border-color: #F0908A; }
  button { width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, #F0908A 0%, #E8344E 100%); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 24px rgba(240,144,138,0.35); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5); white-space: nowrap; }
  .toast.success { background: #1a3a1a; border: 1px solid #4ADE80; color: #4ADE80; }
  .toast.error { background: #3a1a1a; border: 1px solid #E8344E; color: #E8344E; }
  .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #E8344E; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo { text-align: center; margin-bottom: 24px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #F0908A, #E8344E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="spinner" id="loading"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jscmqcjornseiclxvvqv.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzY21xY2pvcm5zZWljbHh2dnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDI0MjAsImV4cCI6MjA4NjY3ODQyMH0.4h-xYK7D2MnaFvqI-JHTc6bcESQadoUVGsoE27rWEWg'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const app = document.getElementById('app')

function showToast(msg, type) {
  const t = document.createElement('div')
  t.className = 'toast ' + type
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 4000)
}

function showForm() {
  app.innerHTML = `
    <div class="logo">ShaPop</div>
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez votre nouveau mot de passe</p>
    <label>Nouveau mot de passe</label>
    <input type="password" id="pw1" placeholder="Au moins 8 caracteres" autocomplete="new-password">
    <label>Confirmer le mot de passe</label>
    <input type="password" id="pw2" placeholder="Confirmez votre mot de passe" autocomplete="new-password">
    <button id="btn">Mettre a jour</button>
  `
  document.getElementById('btn').onclick = async () => {
    const pw1 = document.getElementById('pw1').value
    const pw2 = document.getElementById('pw2').value
    if (!pw1 || !pw2) return showToast('Veuillez remplir tous les champs', 'error')
    if (pw1 !== pw2) return showToast('Les mots de passe ne correspondent pas', 'error')
    if (pw1.length < 8) return showToast('Au moins 8 caracteres', 'error')
    const btn = document.getElementById('btn')
    btn.disabled = true
    btn.textContent = 'Mise a jour...'
    try {
      const { error } = await sb.auth.updateUser({ password: pw1 })
      if (error) throw error
      showToast('Mot de passe mis a jour !', 'success')
      app.innerHTML = '<div class="logo">ShaPop</div><h1>Mot de passe mis a jour</h1><p class="subtitle">Vous pouvez maintenant retourner dans l\'app et vous connecter avec votre nouveau mot de passe.</p>'
    } catch (e) {
      showToast(e.message || 'Erreur', 'error')
      btn.disabled = false
      btn.textContent = 'Mettre a jour'
    }
  }
}

function showError() {
  app.innerHTML = '<div class="logo">ShaPop</div><h1>Lien invalide</h1><p class="subtitle">Ce lien de reinitialisation est invalide ou a expire. Veuillez refaire une demande depuis l\'app.</p>'
}

// Wait for Supabase to process hash tokens
async function init() {
  const hash = window.location.hash
  if (!hash || !hash.includes('type=recovery')) {
    showError()
    return
  }
  // Supabase auto-detects hash and sets session
  const { data: { session } } = await sb.auth.getSession()
  if (session) {
    showForm()
  } else {
    // Retry after a moment
    setTimeout(async () => {
      const { data: { session: s2 } } = await sb.auth.getSession()
      if (s2) showForm()
      else showError()
    }, 2000)
  }
}

init()
</script>
</body>
</html>
