<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShaPop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 400px; padding: 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .subtitle { color: #888; font-size: 14px; text-align: center; margin-bottom: 32px; }
  label { display: block; font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #1A1A1A; border-radius: 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 20px; }
  input:focus { border-color: #F0908A; }
  button { width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(135deg, #F0908A 0%, #E8344E 100%); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 24px rgba(240,144,138,0.35); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5); white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
  .toast.success { background: #1a3a1a; border: 1px solid #4ADE80; color: #4ADE80; }
  .toast.error { background: #3a1a1a; border: 1px solid #E8344E; color: #E8344E; }
  .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #E8344E; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo { text-align: center; margin-bottom: 24px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #F0908A, #E8344E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="spinner" id="loading"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jscmqcjornseiclxvvqv.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzY21xY2pvcm5zZWljbHh2dnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDI0MjAsImV4cCI6MjA4NjY3ODQyMH0.4h-xYK7D2MnaFvqI-JHTc6bcESQadoUVGsoE27rWEWg'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const app = document.getElementById('app')

// Textes en 5 langues (en, fr, es, ru, he) : langue choisie dans l'app, sinon langue du téléphone, sinon anglais.
const T = {
  en: { title: 'New password', subtitle: 'Choose your new password', pw: 'New password', pwPh: 'At least 8 characters', confirm: 'Confirm password', confirmPh: 'Type your password again', btn: 'Update', updating: 'Updating...', fill: 'Please fill in both fields', mismatch: 'The passwords don\'t match', short: 'At least 8 characters', done: 'Password updated!', doneText: 'You can now go back to the app and sign in with your new password.', error: 'Something went wrong. Please try again.', invalid: 'Invalid link', invalidText: 'This reset link is invalid or has expired. Please request a new one from the app.' },
  fr: { title: 'Nouveau mot de passe', subtitle: 'Choisis ton nouveau mot de passe', pw: 'Nouveau mot de passe', pwPh: 'Au moins 8 caractères', confirm: 'Confirme le mot de passe', confirmPh: 'Retape ton mot de passe', btn: 'Mettre à jour', updating: 'Mise à jour...', fill: 'Remplis les deux champs', mismatch: 'Les mots de passe ne correspondent pas', short: 'Au moins 8 caractères', done: 'Mot de passe mis à jour !', doneText: 'Tu peux maintenant revenir dans l\'app et te connecter avec ton nouveau mot de passe.', error: 'Une erreur est survenue. Réessaie.', invalid: 'Lien invalide', invalidText: 'Ce lien de réinitialisation est invalide ou a expiré. Refais une demande depuis l\'app.' },
  es: { title: 'Nueva contraseña', subtitle: 'Elige tu nueva contraseña', pw: 'Nueva contraseña', pwPh: 'Al menos 8 caracteres', confirm: 'Confirma la contraseña', confirmPh: 'Vuelve a escribir tu contraseña', btn: 'Actualizar', updating: 'Actualizando...', fill: 'Rellena los dos campos', mismatch: 'Las contraseñas no coinciden', short: 'Al menos 8 caracteres', done: '¡Contraseña actualizada!', doneText: 'Ya puedes volver a la app e iniciar sesión con tu nueva contraseña.', error: 'Algo ha fallado. Inténtalo de nuevo.', invalid: 'Enlace no válido', invalidText: 'Este enlace no es válido o ha caducado. Solicita uno nuevo desde la app.' },
  ru: { title: 'Новый пароль', subtitle: 'Придумай новый пароль', pw: 'Новый пароль', pwPh: 'Не менее 8 символов', confirm: 'Повтори пароль', confirmPh: 'Введи пароль ещё раз', btn: 'Обновить', updating: 'Обновляем...', fill: 'Заполни оба поля', mismatch: 'Пароли не совпадают', short: 'Не менее 8 символов', done: 'Пароль обновлён!', doneText: 'Теперь можно вернуться в приложение и войти с новым паролем.', error: 'Что-то пошло не так. Попробуй ещё раз.', invalid: 'Ссылка недействительна', invalidText: 'Эта ссылка для сброса пароля недействительна или устарела. Запроси новую в приложении.' },
  he: { title: 'סיסמה חדשה', subtitle: 'בחר/י סיסמה חדשה', pw: 'סיסמה חדשה', pwPh: 'לפחות 8 תווים', confirm: 'אימות סיסמה', confirmPh: 'הקלד/י שוב את הסיסמה', btn: 'עדכון', updating: 'מעדכן...', fill: 'יש למלא את שני השדות', mismatch: 'הסיסמאות אינן תואמות', short: 'לפחות 8 תווים', done: 'הסיסמה עודכנה!', doneText: 'אפשר לחזור לאפליקציה ולהתחבר עם הסיסמה החדשה.', error: 'משהו השתבש. נסה/י שוב.', invalid: 'קישור לא תקין', invalidText: 'קישור האיפוס אינו תקין או שפג תוקפו. בקש/י קישור חדש מתוך האפליקציה.' },
}
function pickLang() {
  const ok = Object.keys(T)
  try { const s = localStorage.getItem('shapop_lang'); if (ok.includes(s)) return s } catch (e) {}
  const list = (navigator.languages || []).concat(navigator.language || [])
  for (const l of list) { let c = String(l).slice(0, 2).toLowerCase(); if (c === 'iw') c = 'he'; if (ok.includes(c)) return c }
  return 'en'
}
const LANG = pickLang()
const tx = T[LANG]
document.documentElement.lang = LANG
document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr'
document.title = 'ShaPop — ' + tx.title

function showToast(msg, type) {
  const t = document.createElement('div')
  t.className = 'toast ' + type
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 4000)
}

function screen(title, text) {
  app.innerHTML = '<div class="logo">ShaPop</div><h1></h1><p class="subtitle"></p>'
  app.querySelector('h1').textContent = title
  app.querySelector('.subtitle').textContent = text
}

function showForm() {
  app.innerHTML = `
    <div class="logo">ShaPop</div>
    <h1>${tx.title}</h1>
    <p class="subtitle">${tx.subtitle}</p>
    <label>${tx.pw}</label>
    <input type="password" id="pw1" placeholder="${tx.pwPh}" autocomplete="new-password">
    <label>${tx.confirm}</label>
    <input type="password" id="pw2" placeholder="${tx.confirmPh}" autocomplete="new-password">
    <button id="btn">${tx.btn}</button>
  `
  document.getElementById('btn').onclick = async () => {
    const pw1 = document.getElementById('pw1').value
    const pw2 = document.getElementById('pw2').value
    if (!pw1 || !pw2) return showToast(tx.fill, 'error')
    if (pw1 !== pw2) return showToast(tx.mismatch, 'error')
    if (pw1.length < 8) return showToast(tx.short, 'error')
    const btn = document.getElementById('btn')
    btn.disabled = true
    btn.textContent = tx.updating
    try {
      const { error } = await sb.auth.updateUser({ password: pw1 })
      if (error) throw error
      showToast(tx.done, 'success')
      screen(tx.done, tx.doneText)
    } catch (e) {
      showToast(tx.error, 'error')
      btn.disabled = false
      btn.textContent = tx.btn
    }
  }
}

function showError() {
  screen(tx.invalid, tx.invalidText)
}

// Wait for Supabase to process hash tokens
async function init() {
  const hash = window.location.hash
  if (!hash || !hash.includes('type=recovery')) {
    showError()
    return
  }
  // Supabase auto-detects hash and sets session
  const { data: { session } } = await sb.auth.getSession()
  if (session) {
    showForm()
  } else {
    // Retry after a moment
    setTimeout(async () => {
      const { data: { session: s2 } } = await sb.auth.getSession()
      if (s2) showForm()
      else showError()
    }, 2000)
  }
}

init()
</script>
</body>
</html>
