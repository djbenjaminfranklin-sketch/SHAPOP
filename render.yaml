services:
  - type: web
    name: shapop-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        value: https://shapop.app
      - key: PLATFORM_COMMISSION
        value: "0.08"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      # 0 = no cap enforced by LiveKit on room size
      - key: LIVEKIT_MAX_PARTICIPANTS
        value: "0"
      # Live recordings -> S3-compatible bucket (Cloudflare R2). Leave empty = no recording (nothing billed).
      - key: RECORDING_S3_ENDPOINT
        sync: false
      - key: RECORDING_S3_BUCKET
        sync: false
      - key: RECORDING_S3_REGION
        value: auto
      - key: RECORDING_S3_ACCESS_KEY
        sync: false
      - key: RECORDING_S3_SECRET
        sync: false
      - key: RECORDING_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
